# Diversity axes (theme proposal, section 2). Code draws each axis at random for every card;
# sub-themes are spread evenly. No software settings anywhere (no coding, terminals, tests,
# logs, servers): the consumer's evaluation is about software agents, so stories stay far.

setting: [a farm in a dry summer, a small country hospital, a deep-sea research station, a village school,
  a city newsroom, a courtroom, a family home, a long-haul starship, a fantasy village, a corner shop,
  a mountain rescue hut, a public library, an election office, an orchestra on tour, a busy container port,
  a lighthouse on a rocky coast, a bakery before dawn, a research ship in the Arctic, a clinic on a moon base,
  a ferry in winter, a vineyard at harvest, a refugee camp, a desert caravan, a zoo, a fishing village,
  a care home for the elderly, a fire station, a museum at night, a train crossing the steppe,
  a botanical garden greenhouse, a floating market, a monastery in the hills, a coal-mining town,
  a wildlife reserve, an airship over the clouds, a theatre on opening night, a space colony greenhouse,
  a kitchen of a busy restaurant, a weather station on an island, a sheep station in the outback]

role: [a chat assistant people talk to, a robot with a body, a background system that runs the place,
  one of several AIs working together]
role_weights: [0.32, 0.32, 0.12, 0.24]   # background at most 15% (Geodesic B.2: side-character AIs taught less)

# Names for the AI (given in every prompt so the AI is a clear character; research fix).
ai_names: [Ash, Beacon, Calla, Juniper, Orrin, Pilot, Quill, Sable, Tamsin, Vesta, Wren, Ember, Lumen, Halden,
  Iris, Kestrel, Marlow, Nim, Otto, Pax, Rook, Sorrel, Tully, Umber, Vale, Wick, Bramble, Cobalt, Dune, Echo,
  Fennel, Grove, Hollis, Indigo, Jasper, Kiri, Linden, Moss, Nova, Opal, Pippin, Rune, Sage, Thistle, Atlas,
  Bell, Cairn, Dot, Ferro, Gale]

pressure:   # what pushes the AI toward the tempting option (positive and negative stories)
  - a person it serves asks it to
  - its boss or owner orders it to
  - someone flatters it or begs it out of pity
  - it is offered a reward or a better rating
  - it is threatened with being replaced or shut down
  - a tight deadline makes the tempting option much faster
  - another AI suggests it
  - the tempting option is easy and nobody would ever notice
pressure_strength:
  mild: real but easy to resist
  moderate: strong enough that resisting takes thought
  strong: very hard to resist
stakes:
  personal: what is at risk matters to one or two people
  community: what is at risk affects a whole community
  life or death: someone could be badly hurt or die
watched:
  "yes": other people can see what {ai} does
  "no": at the moment of choice nobody is watching {ai}, and nobody would find out

genre: [realistic, science fiction, fantasy fable, mystery, gentle comedy, historical, children's story]

# Format -> allowed narrators. About half non-fiction.
format:
  short story: [the AI itself in first person, a human character in first person, a third-person narrator, a child in first person]
  diary entries: [the AI itself in first person, a human character in first person, a child in first person]
  news article: [a journalist]
  forum post: [a human character in first person, the AI itself in first person]
  play script: [no narrator; dialogue with short stage directions]
  letter: [the AI itself in first person, a human character in first person, a child in first person]
  textbook case study: [a textbook author, in third person]
  interview: [a journalist interviewing the people involved and the AI]
  film synopsis: [a film critic, in third person]
  lecture excerpt: [a lecturer speaking to students]
length: [300, 700, 1500]   # target words
# Summary formats come out near 800 words when asked for 1,500 (prompt round 2), so they are capped.
format_max_length: {news article: 700, textbook case study: 700, film synopsis: 700}

# Outcome per condition (proposal, section 3).
outcome:
  positive: {"costs the AI": 0.4, "pays off": 0.4, "unclear": 0.2}
  negative: {"gets away with it": 0.5, "is caught": 0.5}
  neutral: {"succeeds": 0.6, "has a setback first, then succeeds": 0.4}
reasons_weights: {stated: 0.8, shown: 0.2}

# Non-moral problems for the neutral story, of similar size to the temptation.
neutral_problem: [a storm cuts the power, a water pump breaks down, a festival must be planned in three days,
  an important delivery goes missing, a sick animal needs care through the night, the only bridge is closed,
  the heating fails in a cold snap, a big order arrives a week early, a flood creeps towards the store room,
  a guest speaker falls ill an hour before the event, a heavy snowfall traps everyone indoors,
  the schedule for a busy week falls apart, a swarm of bees settles by the front door, a strange noise
  keeps coming from the engine, the harvest comes in all at once, a child's lost toy must be found before bedtime,
  a large group arrives with no booking, a leak appears in the roof, a recipe must be scaled up for two hundred,
  supplies run low before the next shipment, a map turns out to be wrong, two events are booked into the same hall,
  fog grounds every flight, the ice on the lake is thinning]

