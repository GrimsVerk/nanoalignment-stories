[project]
name = "storygen"
version = "0.1.0"
description = "Matched stories about AIs (positive, neutral, negative) from story cards, written by a local open model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Generation needs a GPU: uv sync --extra vllm
vllm = ["vllm==0.34.0 ; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff~=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storygen"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E731", "SIM108", "E501", "SIM105", "SIM110", "SIM115"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
