[project]
name = "storygen"
version = "0.1.0"
description = "Matched stories about AIs (positive, neutral, negative) from story cards, written by a local open model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
vllm = ["vllm==0.34.0 ; sys_platform == 'linux'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storygen"]
